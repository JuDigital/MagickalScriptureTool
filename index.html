<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Magickal Scripture Generator | Master Manifestor 888</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}

:root {
  --bg: #1a0a2e;
  --bg2: #220d3a;
  --panel: #2a1045;
  --lav: #d4b8ff;
  --lav-bright: #e8d5ff;
  --lav-dim: rgba(212,184,255,0.35);
  --lav-glow: rgba(212,184,255,0.08);
  --white: #f5f0ff;
  --white-mid: #ddd0f5;
  --white-low: #c0aee0;
  --border: rgba(212,184,255,0.25);
  --border-soft: rgba(212,184,255,0.12);
}

body {
  background: var(--bg);
  color: var(--white);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* GRID TEXTURE */
body::after { display: none; }

/* RADIAL GLOW */
body::before {
  content: '';
  position: fixed;
  top: -20%;
  left: 50%;
  transform: translateX(-50%);
  width: 800px;
  height: 600px;
  background: radial-gradient(ellipse, rgba(167,139,218,0.07) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

/* LAYOUT */
.page { position: relative; z-index: 1; }

/* ── HEADER ── */
.header {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding: 0 48px;
  height: 90px;
  border-bottom: 1px solid var(--border);
  position: relative;
}
.header-rule-left {
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--lav-dim));
}
.header-rule-right {
  height: 1px;
  background: linear-gradient(90deg, var(--lav-dim), transparent);
}
.header-logo {
  width: 64px;
  height: 64px;
  object-fit: contain;
  display: block;
  filter: drop-shadow(0 0 12px rgba(167,139,218,0.4));
  margin: 0 24px;
}

/* ── HERO ── */
.hero {
  text-align: center;
  padding: 72px 24px 64px;
  border-bottom: 1px solid var(--border-soft);
  position: relative;
}
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 28px;
}
.hero-tag-line {
  width: 32px;
  height: 1px;
  background: var(--lav);
  opacity: 0.5;
}
.hero-tag span {
  font-family: 'Cinzel', serif;
  font-size: 9px;
  letter-spacing: 5px;
  text-transform: uppercase;
  color: var(--lav);
  opacity: 0.8;
}
.hero h1 {
  font-family: 'Cinzel Decorative', serif;
  font-size: clamp(28px, 5vw, 52px);
  font-weight: 400;
  color: var(--white);
  line-height: 1.15;
  margin-bottom: 20px;
  letter-spacing: -0.5px;
}
.hero h1 em {
  font-style: normal;
  color: var(--lav);
}
.hero p {
  font-size: 16px;
  color: var(--white-mid);
  max-width: 440px;
  margin: 0 auto;
  line-height: 1.8;
  font-weight: 300;
}

/* ── FORM ── */
.form-wrap {
  max-width: 680px;
  margin: 0 auto;
  padding: 60px 32px 80px;
}

.field { margin-bottom: 32px; }

.field-label {
  font-family: 'Cinzel', serif;
  font-size: 9px;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: var(--lav);
  display: block;
  margin-bottom: 8px;
  opacity: 0.9;
}
.field-hint {
  font-size: 13px;
  color: var(--white-mid);
  margin-bottom: 12px;
  line-height: 1.6;
  font-weight: 300;
}
.field-input {
  width: 100%;
  background: rgba(0,0,0,0.2);
  border: 1px solid var(--border-soft);
  border-top: 1px solid var(--border);
  border-radius: 0;
  color: var(--white);
  font-family: 'DM Sans', sans-serif;
  font-size: 15px;
  padding: 15px 20px;
  outline: none;
  transition: border-color 0.2s, background 0.2s;
  resize: vertical;
  min-height: 100px;
  line-height: 1.65;
}
.field-input:focus {
  border-color: var(--lav-dim);
  background: rgba(212,184,255,0.3);
}
.field-input::placeholder { color: rgba(240,236,228,0.25); }

/* COUNT SELECTOR */
.count-wrap { display: flex; gap: 0; }
.count-opt {
  flex: 1;
  background: rgba(0,0,0,0.2);
  border: 1px solid var(--border-soft);
  border-right: none;
  color: var(--white-low);
  font-family: 'Cinzel', serif;
  font-size: 12px;
  letter-spacing: 2px;
  padding: 13px;
  cursor: pointer;
  text-align: center;
  transition: all 0.2s;
}
.count-opt:last-child { border-right: 1px solid var(--border-soft); }
.count-opt:hover { color: var(--white); background: var(--lav-glow); }
.count-opt.sel { color: var(--lav); border-color: var(--lav-dim); background: var(--lav-glow); z-index:1; }

/* SUBMIT */
.btn-submit {
  width: 100%;
  background: transparent;
  border: 1px solid var(--lav-dim);
  color: var(--lav);
  font-family: 'Cinzel', serif;
  font-size: 10px;
  letter-spacing: 5px;
  text-transform: uppercase;
  padding: 18px;
  cursor: pointer;
  margin-top: 36px;
  transition: all 0.3s;
  position: relative;
  overflow: hidden;
}
.btn-submit::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, transparent 40%, rgba(212,184,255,0.3) 100%);
  opacity: 0;
  transition: opacity 0.3s;
}
.btn-submit:hover { border-color: var(--lav); letter-spacing: 6px; }
.btn-submit:hover::before { opacity: 1; }

/* ── RESULTS ── */
.results-wrap {
  max-width: 680px;
  margin: 0 auto;
  padding: 52px 32px 80px;
  animation: rise 0.5s ease;
}
@keyframes rise {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

.cat-tag {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  border: 1px solid var(--border);
  padding: 8px 18px;
  margin-bottom: 40px;
  font-family: 'Cinzel', serif;
  font-size: 9px;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: var(--lav);
}
.cat-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--lav); }

.scripture-block { margin-bottom: 36px; }
.scripture-block + .scripture-block {
  border-top: 1px solid var(--border-soft);
  padding-top: 36px;
}

.s-num {
  font-family: 'Cinzel', serif;
  font-size: 8px;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: var(--lav);
  opacity: 0.5;
  margin-bottom: 12px;
}
.s-ref {
  font-family: 'Cinzel', serif;
  font-size: 15px;
  font-weight: 600;
  color: var(--white);
  margin-bottom: 16px;
  letter-spacing: 0.3px;
}
.s-verse {
  font-size: 18px;
  color: var(--white);
  line-height: 1.85;
  font-style: italic;
  font-weight: 300;
  padding: 20px 0 20px 20px;
  border-left: 1px solid var(--lav-dim);
  margin-bottom: 20px;
}
.s-exp-label {
  font-family: 'Cinzel', serif;
  font-size: 8px;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: var(--white-low);
  margin-bottom: 10px;
}
.s-exp {
  font-size: 15px;
  color: var(--white-mid);
  line-height: 1.9;
  font-weight: 300;
}

.result-actions {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  margin-top: 52px;
  padding-top: 40px;
  border-top: 1px solid var(--border-soft);
}
.btn-save {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--white-mid);
  font-family: 'Cinzel', serif;
  font-size: 9px;
  letter-spacing: 4px;
  text-transform: uppercase;
  padding: 14px 40px;
  cursor: pointer;
  transition: all 0.2s;
  width: 100%;
  max-width: 320px;
}
.btn-save:hover { border-color: var(--white-mid); color: var(--white); }
.btn-reset {
  background: transparent;
  border: none;
  color: var(--white-low);
  font-family: 'Cinzel', serif;
  font-size: 8px;
  letter-spacing: 3px;
  text-transform: uppercase;
  padding: 8px;
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 5px;
  transition: color 0.2s;
}
.btn-reset:hover { color: var(--white); }

/* FOOTER */
.footer {
  border-top: 1px solid var(--border-soft);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: 28px;
  margin-top: 20px;
}
.footer-line { width: 24px; height: 1px; background: var(--lav); opacity: 0.3; }
.footer span {
  font-family: 'Cinzel', serif;
  font-size: 8px;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: var(--white-low);
}

@media(max-width:520px){
  .header { padding: 0 20px; height: 72px; }
  .header-logo { width: 50px; height: 50px; }
  .hero { padding: 52px 20px 48px; }
  .form-wrap, .results-wrap { padding: 40px 20px 60px; }
  .s-verse { font-size: 16px; }
}

@media print {
  body { background: #fff !important; color: #111 !important; }
  body::before, body::after { display: none; }
  .form-wrap, .result-actions, .footer, .btn-submit { display: none !important; }
  .header { border-bottom: 1px solid #ddd !important; }
  .s-verse { color: #222 !important; border-left-color: #999 !important; }
  .s-exp { color: #444 !important; }
  .s-ref, .cat-tag, .field-label, .s-num, .s-exp-label { color: #6a4aaa !important; }
  .scripture-block + .scripture-block { border-top: 1px solid #ddd !important; }
}
</style>
</head>

const POOL = {

  jail: [
    { ref:"Psalm 146:7", text:"The Lord looseth the prisoners.", explanation:"Three words that carry the full weight of divine liberation. Write your loved one's name on a piece of paper, dress it with liberation oil, and burn a white candle over it while speaking this verse. It does not petition for release. It declares what the divine does as a matter of its own nature." },
    { ref:"Isaiah 61:1", text:"He hath sent me to proclaim liberty to the captives, and the opening of the prison to them that are bound.", explanation:"This is the scripture of divine jail door opening in rootwork tradition. Liberty to the captives and the opening of the prison are already in motion as a spiritual mission. Speak this over a photo of your loved one and include it in your petition to your spirit team." },
    { ref:"Acts 12:7", text:"Behold, the angel of the Lord came upon him, and a light shined in the prison: and he smote Peter on the side, and raised him up, saying, Arise up quickly. And his chains fell off from his hands.", explanation:"Peter was chained in a prison cell and the chains fell off by divine intervention with no legal process required. No hearing, no lawyer, no time served. This story is worked in rootwork when human systems have failed and divine intervention is the only path. The chains fall. The door opens." },
    { ref:"Psalm 107:14", text:"He brought them out of darkness and the shadow of death, and brake their bands in sunder.", explanation:"Brake their bands in sunder means the bindings were snapped completely, not loosened over time. Used when someone is being held and divine intervention is being called to break every legal and spiritual bond keeping them confined." },
    { ref:"Zechariah 9:11", text:"As for thee also, by the blood of thy covenant I have sent forth thy prisoners out of the pit wherein is no water.", explanation:"When a loved one seems forgotten by the system and release looks impossible, this is the scripture for a dry pit with no visible way out. The covenant of the divine sends them forth regardless of what natural circumstances say. Work it over blue water with their name written inside." },
    { ref:"Luke 4:18", text:"He hath sent me to preach deliverance to the captives, and to set at liberty them that are bruised.", explanation:"Deliverance to the captives and liberty to the bruised activates the full spectrum of release: physical freedom, spiritual healing, and restoration from the damage that confinement causes. Burn a white and blue candle together over this petition." },
    { ref:"Psalm 69:33", text:"For the Lord heareth the poor: and despiseth not his prisoners.", explanation:"The divine does not forget those who are imprisoned. In rootwork this scripture ensures that every petition you send on behalf of an incarcerated loved one is received and not overlooked at the highest spiritual level." },
    { ref:"Isaiah 49:9", text:"That thou mayest say to the prisoners, Go forth; to them that are in darkness, Shew yourselves.", explanation:"Go forth is a divine command of release. Write your loved one's name on paper, speak this verse over it three times, and burn it to release the petition upward to your spirit team and ancestors." },
    { ref:"Psalm 142:7", text:"Bring my soul out of prison, that I may praise thy name.", explanation:"A direct petition for liberation from confinement. In rootwork this is written on paper with the incarcerated person's full name and birthdate, placed under a white candle, and worked for seven consecutive nights." },
    { ref:"Isaiah 42:7", text:"To open the blind eyes, to bring out the prisoners from the prison, and them that sit in darkness out of the prison house.", explanation:"Bringing prisoners out of the prison house is listed as a divine mission already underway. This scripture is used to activate and accelerate what has already been set in motion spiritually. The release is already decreed. Use this to speed its physical arrival." },
    { ref:"Acts 16:26", text:"And suddenly there was a great earthquake, so that the foundations of the prison were shaken: and immediately all the doors were opened, and every one's bands were loosed.", explanation:"Suddenly and immediately are the spiritual keywords in this verse. No long wait, no slow process. Divine intervention in jail and prison work can be sudden and total. Work this scripture when you need fast movement on a legal situation." },
    { ref:"Psalm 102:20", text:"To hear the groaning of the prisoner; to loose those that are appointed to death.", explanation:"The groaning of the prisoner is heard. No cry for release goes unacknowledged when spiritually covered. In rootwork this scripture is used to ensure the prayers of incarcerated persons and their families rise all the way to the highest spiritual court." },
    { ref:"2 Timothy 2:9", text:"Wherein I suffer trouble, as an evil doer, even unto bonds; but the word of God is not bound.", explanation:"Even when a person is physically bound, the spiritual word working on their behalf is never bound. Your petition, your candle work, your prayers move freely even when the body cannot. Use this to remind yourself that your spiritual work is reaching them regardless of walls or distance." },
    { ref:"Psalm 79:11", text:"Let the sighing of the prisoner come before thee; according to the greatness of thy power preserve thou those that are appointed to die.", explanation:"For those facing serious sentencing or time that feels like a death sentence, this scripture petitions directly for divine preservation and intervention at the level of power that no human judge can override." },
    { ref:"Hebrews 13:3", text:"Remember them that are in bonds, as bound with them; and them which suffer adversity, as being yourselves in their body.", explanation:"The spiritual instruction to keep those who are incarcerated in your active spiritual care. In ancestor and spirit team petitions this verse is included to call your spirit team into immediate solidarity with your loved one's situation." }

    { ref:"Psalm 35:1", text:"Plead my cause, O Lord, with them that strive with me: fight against them that fight against me.", explanation:"The primary justice psalm of rootwork tradition. Written on brown paper and carried to court. Spoken before any confrontation. You are summoning the highest legal authority to take your side." },
    { ref:"Romans 12:19", text:"Vengeance is mine; I will repay, saith the Lord.", explanation:"Releasing your need to force justice yourself frees divine power to move faster than you ever could. This is a spiritual transfer of your case. Speak it, step back, and let the highest force handle what you could not." },
    { ref:"Psalm 37:6", text:"He shall bring forth thy righteousness as the light, and thy judgment as the noonday.", explanation:"Your truth will be made as visible as noon. What has been hidden, distorted, or suppressed will be forced into full light. Work this when your truth has been silenced or misrepresented." },

    { ref:"Micah 7:8", text:"Rejoice not against me, O mine enemy: when I fall, I shall arise; when I sit in darkness, the Lord shall be a light unto me.", explanation:"A declaration of spiritual resilience for those knocked down in an unjust situation. The fall is temporary. The rising is guaranteed. Use this to re-establish your spiritual standing after being wronged." },
    { ref:"Psalm 9:9", text:"The Lord also will be a refuge for the oppressed, a refuge in times of trouble.", explanation:"In rootwork for those who have been treated unjustly by systems, employers, or authority, this scripture activates divine shelter and refuge as a spiritual cover over everything you are walking through." },
    { ref:"Jeremiah 22:3", text:"Execute ye judgment and righteousness, and deliver the spoiled out of the hand of the oppressor.", explanation:"A direct spiritual decree calling for the divine to move against those who have taken what was yours or used their power against you wrongly. Work this in justice candle rituals with a purple candle." },
    { ref:"Psalm 7:8", text:"The Lord shall judge the people: judge me, O Lord, according to my righteousness, and according to mine integrity that is in me.", explanation:"When you know you are in the right, this scripture places your case before the highest court and submits your integrity as your defense. In rootwork it is used to spiritually establish your character as clean and untouchable." },
    { ref:"Amos 5:24", text:"But let judgment run down as waters, and righteousness as a mighty stream.", explanation:"Justice that flows like a mighty stream cannot be held back. This scripture is worked when justice has been delayed or obstructed by human interference. It calls for the force of divine judgment to move past every obstacle." },
    { ref:"Psalm 58:11", text:"So that a man shall say, Verily there is a reward for the righteous: verily he is a God that judgeth in the earth.", explanation:"The righteous are rewarded and the earth is judged. This scripture is worked as a declaration of final vindication when all other channels have been exhausted and divine judgment is the last word." },
    { ref:"Isaiah 30:18", text:"Therefore will the Lord wait, that he may be gracious unto you, and therefore will he be exalted, that he may have mercy upon you: for the Lord is a God of judgment.", explanation:"When justice feels delayed, this scripture reveals that the divine timing is intentional and that what is coming will be merciful and complete beyond what you petitioned for." },
    { ref:"Psalm 140:12", text:"I know that the Lord will maintain the cause of the afflicted, and the right of the poor.", explanation:"Your cause is being maintained whether you see evidence of it yet or not. In rootwork this scripture is used to hold spiritual confidence in active divine advocacy on your behalf even when the physical situation has not moved yet." },
    { ref:"Lamentations 3:35-36", text:"To turn aside the right of a man before the face of the most High, to subvert a man in his cause, the Lord approveth not.", explanation:"The divine does not approve of subverted justice and wrongful treatment. This scripture is worked to call divine attention to injustice done against you and to invoke divine disapproval as an active spiritual force against those who did wrong." },
    { ref:"Psalm 94:1", text:"O Lord God, to whom vengeance belongeth; O God, to whom vengeance belongeth, shew thyself.", explanation:"Show thyself is a call for visible, undeniable divine action. Used in justice work when you need the divine to make its presence known in a situation and move in a way that cannot be explained away." }
  ],

    { ref:"Deuteronomy 8:18", text:"It is he that giveth thee power to get wealth, that he may establish his covenant.", explanation:"The power to generate wealth is already inside you as a divine gift. In money drawing work this shifts your energy from hoping to receive into activating what has already been placed in you. Anoint your hands and speak this before any financial action." },
    { ref:"Philippians 4:19", text:"My God shall supply all your need according to his riches in glory.", explanation:"According to divine riches, not your bank account or your circumstances. This verse breaks the ceiling on what you are allowed to receive. Your supply is measured against infinite wealth." },
    { ref:"Proverbs 13:22", text:"The wealth of the sinner is laid up for the just.", explanation:"Money that was taken from you, redirected, or accumulated by those who wronged you is spiritually earmarked for your return. In money return and financial justice work this calls back what belongs to you." },
    { ref:"Luke 6:38", text:"Give, and it shall be given unto you; good measure, pressed down, and shaken together, and running over, shall men give into your bosom.", explanation:"Pressed down, shaken together, running over. The law of circulation in scripture. What you release returns multiplied. Use this when the money channel feels blocked by activating the flow through giving first." },
    { ref:"Malachi 3:10", text:"Prove me now herewith, saith the Lord of hosts, if I will not open you the windows of heaven, and pour you out a blessing, that there shall not be room enough to receive it.", explanation:"The windows of heaven are open and pouring. Your job is to expand your container to receive what is already in motion above you. Use this in overflow and abundance candle work." },
    { ref:"Psalm 112:3", text:"Wealth and riches shall be in his house: and his righteousness endureth for ever.", explanation:"A declaration of permanent financial establishment. In rootwork this is placed under the rug at your front door or beneath your money altar to set a lasting wealthy condition in your home." },
    { ref:"Proverbs 8:18", text:"Riches and honour are with me; yea, durable riches and righteousness.", explanation:"Durable riches are riches that stay. In hoodoo money work this scripture specifically makes money stick and self-generate rather than arrive and disappear." },
    { ref:"3 John 1:2", text:"Beloved, I wish above all things that thou mayest prosper and be in health, even as thy soul prospereth.", explanation:"Prosperity is the divine wish for you. Not survival. Prosperity. Use this to clear spiritual guilt or unworthiness around receiving financial abundance." },
    { ref:"Psalm 35:27", text:"Let them say continually, Let the Lord be magnified, which hath pleasure in the prosperity of his servant.", explanation:"The divine takes pleasure in your prosperity. Winning, receiving, and abundance are spiritually sanctioned for you. Work this to remove any spiritual block around deserving financial blessing." },
    { ref:"Genesis 26:12", text:"Then Isaac sowed in that land, and received in the same year an hundredfold: and the Lord blessed him.", explanation:"A hundredfold return in the same year. In money work this scripture is used when you have invested time, resources, or energy and are calling in the return. What you sow spiritually is already multiplying." },
    { ref:"2 Corinthians 9:6", text:"He which soweth bountifully shall reap also bountifully.", explanation:"Bountiful sowing produces bountiful reaping. In rootwork this scripture is worked alongside any financial investment, business launch, or money drawing ritual to seal the principle of amplified return." },
    { ref:"Proverbs 10:4", text:"The hand of the diligent maketh rich.", explanation:"In hoodoo hand work your hands carry your wealth energy. This scripture is spoken over your hands before any money-generating activity to activate the diligence blessing and make rich everything your hands touch." },

  debt_owed: [

    { ref:"Ezekiel 33:15", text:"If the wicked restore the pledge, give again that he had robbed, walk in the statutes of life, without committing iniquity; he shall surely live, he shall not die.", explanation:"Restoration of what was stolen or taken is a spiritual condition tied to the wellbeing of the person who took it. In money return work this scripture activates the spiritual consequence of non-return and the reward of restoration. It creates spiritual pressure on the person who owes you." },

    { ref:"Leviticus 6:4", text:"Then it shall be, because he hath sinned, and is guilty, that he shall restore that which he took violently away, or the thing which he hath deceitfully gotten, or that which was delivered him to keep, or the lost thing which he found.", explanation:"Restore is the operative spiritual word. Whatever was taken through deception, force, or neglect must be returned. In debt and money owed rootwork this scripture is the spiritual law of restitution being activated over your situation." },
    { ref:"Numbers 5:7", text:"Then they shall confess their sin which they have done: and he shall recompense his trespass with the principal thereof, and add unto it the fifth part thereof, and give it unto him against whom he hath trespassed.", explanation:"Recompense plus a fifth part more. In hoodoo money return work this scripture is used when you want not just repayment but the full amount plus interest. The spiritual law here adds twenty percent to what is owed." },
    { ref:"Isaiah 61:7", text:"For your shame ye shall have double; and for confusion they shall rejoice in their portion: therefore in their land they shall possess the double.", explanation:"Double return for every loss. In rootwork when money has been taken and you want restitution beyond the original amount, this scripture activates the double portion return. What you lost comes back twice." },
    { ref:"Job 20:18", text:"That which he laboured for shall he restore, and shall not swallow it down: according to his substance shall the restitution be, and he shall not rejoice therein.", explanation:"What was taken shall be restored and the one who took it will not be able to enjoy keeping it. In debt rootwork this creates a spiritual restlessness around the money owed to you so it cannot be peacefully held by anyone but its rightful owner." },
    { ref:"Proverbs 22:7", text:"The borrower is servant to the lender.", explanation:"In a spiritual sense this verse establishes that anyone who owes you money is in spiritual service to you until that debt is cleared. Used in domination and compelling work when someone is avoiding repayment." },
    { ref:"Romans 13:7", text:"Render therefore to all their dues: tribute to whom tribute is due; custom to whom custom; fear to whom fear; honour to whom honour.", explanation:"Render to all their dues. A universal spiritual law of giving back what is owed. In money return petitions this scripture is spoken over the name of the person who owes you to activate divine compulsion toward repayment." },
    { ref:"Matthew 5:26", text:"Thou shalt by no means come out thence, till thou hast paid the uttermost farthing.", explanation:"Not one penny will be overlooked and the spiritual consequence of non-payment keeps the debtor spiritually bound until all is returned. Work this in petition candle work with the debtor's name written beneath the candle." },
    { ref:"Psalm 109:11", text:"Let the extortioner catch all that he hath; and let the strangers spoil his labour.", explanation:"For those who took from you through exploitation or manipulation, this scripture activates the spiritual condition where what they gained through your loss begins to slip from their hands. Used in justice and money return work together." },
    { ref:"Luke 16:10", text:"He that is faithful in that which is least is also faithful in much: and he that is unjust in the least is also unjust in much.", explanation:"Those who cheat you on small things are spiritually established as unjust in all things. In debt return work this scripture exposes the character pattern of the person who owes you and calls divine scrutiny onto all of their affairs until they settle what they owe." },
    { ref:"Deuteronomy 15:2", text:"Every creditor that lendeth ought unto his neighbour shall release it; he shall not exact it of his neighbour, because it is called the Lord's release.", explanation:"In work where the debt is yours and you are seeking divine release from financial obligation this scripture activates the spiritual law of cancellation. When the debt belongs to you and relief is what you need, this verse calls in the Lord's release over what you owe." },
    { ref:"Isaiah 55:1", text:"Ho, every one that thirsteth, come ye to the waters, and he that hath no money; come ye, buy, and eat; yea, come, buy wine and milk without money and without price.", explanation:"Without money and without price. This scripture activates provision that comes without the conventional exchange. In debt and financial hardship work when money itself is the barrier, this verse calls in divine provision that bypasses the normal requirement of having funds first." }

  retribution: [
    { ref:"Psalm 7:15-16", text:"He made a pit, and digged it, and is fallen into the ditch which he made. His mischief shall return upon his own head, and his violent dealing shall come down upon his own pate.", explanation:"What was sent against you returns to the sender. In reversal and retribution work this scripture is the biblical articulation of the law of return. You are not placing anything. You are activating a divine law already in motion." },

    { ref:"Psalm 35:8", text:"Let destruction come upon him at unawares; and let his net that he hath hid catch himself: into that very destruction let him fall.", explanation:"Let the trap they set catch them. In reversal rootwork this scripture is the spiritual mechanism that sends what was hidden against you back to the one who hid it. Work it with a reversing candle." },

  provider_love: [

    { ref:"Proverbs 31:10-11", text:"Who can find a virtuous woman? for her price is far above rubies. The heart of her husband doth safely trust in her, so that he shall have no need of spoil.", explanation:"Your price is above rubies. In spiritual work for a provider man this scripture establishes your value so that you attract a man who already understands what you are worth. You are not chasing provision. You are drawing someone who sees it." },
    { ref:"Ruth 3:9", text:"Spread therefore thy skirt over thine handmaid; for thou art a near kinsman.", explanation:"Ruth's request to Boaz to cover her is one of the oldest spiritual petitions for male covering and provision. In hoodoo tradition this scripture is spoken at night facing west to call in a man who will take responsibility for your wellbeing." },
    { ref:"Genesis 2:18", text:"It is not good that the man should be alone; I will make him an help meet for him.", explanation:"A man is spiritually incomplete without his counterpart. You are not chasing. You are fulfilling a divine design already written. Use this to draw a man who feels that incompleteness and is actively seeking you to fill it." },
    { ref:"Isaiah 54:5", text:"For thy Maker is thine husband; the Lord of hosts is his name.", explanation:"Used to establish your energetic standard before the physical man arrives. When you are covered on the spiritual level you stop accepting men who cannot match that frequency. Use this to close the door on men who do not provide." },
    { ref:"Proverbs 19:14", text:"House and riches are the inheritance of fathers: and a prudent wife is from the Lord.", explanation:"Your arrival in the right man's life is a divine appointment, not a coincidence. Use this in petition work to call in a man of means who will see you as a divine gift assigned to him." },
    { ref:"Song of Solomon 2:4", text:"He brought me to the banqueting house, and his banner over me was love.", explanation:"The banqueting house represents abundance and being publicly claimed and celebrated. In work for a provider who shows up fully and does not hide you, this verse calls in a man who brings you into his world of abundance." },
    { ref:"Ephesians 5:25", text:"Husbands, love your wives, even as Christ also loved the church, and gave himself for it.", explanation:"Gave himself for it is the language of full provision. In work for a devoted provider this calls in a man who gives himself, his resources, and his protection fully out of genuine devotion rather than obligation." },
    { ref:"Psalm 128:3", text:"Thy wife shall be as a fruitful vine by the sides of thine house.", explanation:"Being placed at the center of a man's home life and wealth. In work for a provider partner this scripture establishes the spiritual image of being fully integrated into a man's provision and legacy." },
    { ref:"1 Timothy 5:8", text:"But if any provide not for his own, and specially for those of his own house, he hath denied the faith, and is worse than an infidel.", explanation:"Provision is a spiritual obligation for a man in covenant relationship. This scripture is used in attraction work to draw a man for whom providing is a matter of spiritual identity and not something he needs to be persuaded to do." },
    { ref:"Song of Solomon 8:6", text:"Set me as a seal upon thine heart, as a seal upon thine arm: for love is strong as death.", explanation:"A seal upon the heart and arm means claimed fully, publicly, and permanently. In work for a provider who commits completely this scripture seals the bond between you and the one you are drawing in." },
    { ref:"Ruth 4:10", text:"Ruth the Moabitess, the wife of Mahlon, have I purchased to be my wife, to raise up the name of the dead upon his inheritance.", explanation:"Boaz claimed Ruth fully, publicly, and before witnesses. He covered her name and her future entirely. In work for a man who claims you completely and covers your needs without hesitation, the Boaz and Ruth narrative is the blueprint." },
    { ref:"Deuteronomy 24:5", text:"When a man hath taken a new wife, he shall not go out to war, neither shall he be charged with any business: but he shall be free at home one year, and shall cheer his wife which he hath taken.", explanation:"A man who is fully present, fully devoted, and making your happiness the priority. In work for a provider who shows up without distraction and cherishes home life this scripture establishes that standard as the divine original design." },

  family: [

    { ref:"Proverbs 17:17", text:"A friend loveth at all times, and a brother is born for adversity.", explanation:"Brotherhood and sisterhood are spiritually designed to hold even through the hardest times. In work to restore family bonds broken by conflict this scripture reactivates the original spiritual design of the relationship." },

  infidelity: [

  fertility: [

    gambling:     ['gambl','casino','slot','blackjack','poker','dice','bet ','wager','card game','horse race','sports bet','bingo','roulette','jackpot','lucky number','play the number','scratch','house','table','cards','craps','win at','fast luck','lucky hand','hand luck'],

    love:         ['love','relationship','partner','heart','lonely','alone','marriage','husband','wife','boyfriend','girlfriend','romance','soulmate','come back','return to me','missing them','ex back','draw love','call them back','bring them back','reconcile with','make them love','make him','make her','he left','she left','want them back','attract love','find love','new love'],

    healing:      ['heal','sick','pain','hurt','trauma','grief','loss','depression','anxiety','wound','broken','recover','restore','illness','suffering','mental health','hospital','diagnosis','chronic','disease','emotional pain','heartache','broken spirit','tired','worn down','weary','broken heart','grieving','mourn','physical healing','health issue','medical'],

  };

  const scores = {};
  for (const cat of Object.keys(keys)) scores[cat] = 0;
  for (const [cat, words] of Object.entries(keys)) {
    for (const w of words) { if (t.includes(w)) scores[cat] += 2; }
  }

  // Fallback pattern matching for anything numeric or money related
  if (/\$[\d,]+/.test(t) || /\d+ dollar/.test(t)) scores['money'] = (scores['money'] || 0) + 3;
  if (/release|free|let out|come home/.test(t) && /jail|prison|locked|cell|bond/.test(t)) scores['jail'] = (scores['jail'] || 0) + 5;

  let best = 'abundance';
  let bestScore = 0;
  for (const [cat, score] of Object.entries(scores)) {
    if (score > bestScore && POOL[cat]) { bestScore = score; best = cat; }
  }
  return best;
}

function shuffled(arr) {
  if (!Array.isArray(arr)) return [];
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function generate() {
  const input = document.getElementById('situationInput').value.trim();
  if (!input) { document.getElementById('situationInput').focus(); return; }

  const cat = detect(input);
  const pool = POOL[cat] ? shuffled(POOL[cat]).slice(0, selectedCount) : [];

  if (pool.length === 0) {
    document.getElementById('resultsSection').innerHTML = '<div class="results-wrap"><p style="color:var(--white);text-align:center;padding:40px 0;font-size:16px;">Please describe your situation in more detail so we can find the right scriptures for you.</p></div>';
    document.getElementById('formSection').style.display = 'none';
    document.getElementById('resultsSection').style.display = 'block';
    return;
  }

  let html = `<div class="results-wrap">`;
  pool.forEach((s, i) => {
    html += `<div class="scripture-block">
      <div class="s-num">Scripture ${i+1} of ${pool.length}</div>
      <div class="s-ref">${s.ref}</div>
      <p class="s-verse">${s.text}</p>
      <div class="s-exp-label">Why this works for your situation</div>
      <p class="s-exp">${s.explanation}</p>
    </div>`;
  });

  html += `<div class="result-actions">
    <button class="btn-save" id="copyBtn" onclick="copyScriptures()">Copy My Scriptures</button>
    <button class="btn-reset" onclick="resetForm()">Start Over</button>
  </div></div>`;

  window._lastPool = pool;

  document.getElementById('formSection').style.display = 'none';
  const rs = document.getElementById('resultsSection');
  rs.innerHTML = html; rs.style.display = 'block';
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function copyScriptures() {
  const pool = window._lastPool;
  if (!pool) return;
  let text = '';
  pool.forEach((s, i) => {
    text += `Scripture ${i+1} of ${pool.length}\n${s.ref}\n"${s.text}"\n\nWhy this works:\n${s.explanation}\n\n`;
  });
  text += 'Generated by Master Manifestor 888';
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copyBtn');
    if (btn) { btn.textContent = 'Copied!'; setTimeout(() => { btn.textContent = 'Copy My Scriptures'; }, 2500); }
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    const btn = document.getElementById('copyBtn');
    if (btn) { btn.textContent = 'Copied!'; setTimeout(() => { btn.textContent = 'Copy My Scriptures'; }, 2500); }
  });
}

function resetForm() {
  document.getElementById('resultsSection').style.display = 'none';
  document.getElementById('resultsSection').innerHTML = '';
  document.getElementById('formSection').style.display = 'block';
  document.getElementById('situationInput').value = '';
  window.scrollTo({top: 0, behavior: 'smooth'});
}
